name: Watchtower checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check core.js
          node --check seed.js
      - name: Core business-rules tests
        run: npm test
      - name: Verify static assets exist
        run: |
          test -f index.html
          test -f styles.css
          test -f assets/mark.svg
          test -f .github/workflows/pages.yml
